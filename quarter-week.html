<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quarter Week</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #191919;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .wrapper {
      width: 100%;
      padding: 0;
      display: flex;
    }

    .card {
      flex: 1;
      max-height: 165px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    .version {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: white;
      text-transform: uppercase;
      background: black;
      outline: 1px solid white;
      padding: 2px 5px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 2;
    }

    .label {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    .week-number {
      position: absolute;
      font-family: 'Bebas Neue', sans-serif;
      line-height: 1;
      color: #FFD100;
      letter-spacing: 0em;
    }

    .week-of {
      position: absolute;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .quarter-name {
      position: absolute;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .progress-track {
      position: absolute;
      display: flex;
      left: 0;
      right: 0;
    }

    .pip {
      flex: 1;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="version">v72</div>
      <div class="label">UCLA · Quarter Progress</div>
      <div class="week-number" id="weekNum">—</div>
      <div class="week-of" id="weekOf"></div>
      <div class="quarter-name" id="quarterName">—</div>
      <div class="progress-track" id="pips"></div>
    </div>
  </div>

  <script>
    const card    = document.querySelector('.card');
    const weekNum = document.getElementById('weekNum');
    const weekOf  = document.getElementById('weekOf');
    const qName   = document.getElementById('quarterName');
    const pips    = document.getElementById('pips');

    const QUARTERS = [
      { name: "Spring '26", start: 1774828800000, end: 1789948800000 },
      { name: "Fall '26",   start: 1789948800000, end: 1799020800000 },
      { name: "Winter '27", start: 1799020800000, end: 1805846400000 },
      { name: "Spring '27", start: 1805846400000, end: 1805846400000 + (10 * 7 * 86400000) },
    ];
    const TOTAL_WEEKS = 10;

    function getQuarterInfo() {
      const now = Date.now();
      for (const q of QUARTERS) {
        if (now >= q.start && now < q.end) {
          const days = Math.floor((now - q.start) / 86400000);
          const week = Math.min(TOTAL_WEEKS, Math.max(1, Math.ceil((days + 1) / 7)));
          return { week, name: q.name };
        }
      }
      for (const q of QUARTERS) {
        if (now < q.start) return { week: 0, name: `Before ${q.name}` };
      }
      return { week: 0, name: "Quarter Complete" };
    }

    function layout() {
      const W = card.offsetWidth;
      const H = Math.min(W * 0.34, 165);
      card.style.height = H + 'px';

      const padL    = W * 0.03;
      const padT    = H * 0.06;
      const padB    = H * 0.10;
      const pipH    = Math.max(3, W * 0.008);
      const pipGap  = H * 0.09;

      const capH = (H - padT - padB - pipH - pipGap) * 0.88;

      const CAP_RATIO = 0.72;
      const numSize = capH / CAP_RATIO;
      const ascGap = numSize * 0.12;

      weekNum.style.fontSize = numSize + 'px';
      weekNum.style.left     = padL + 'px';
      weekNum.style.top      = (padT - ascGap) + 'px';

      const numW = weekNum.offsetWidth;
      const numBottom = padT + capH * 0.95;

      const textSize = capH * 0.22;
      weekOf.style.fontSize = textSize + 'px';
      qName.style.fontSize  = textSize + 'px';

      const ofH      = weekOf.offsetHeight;
      const qH       = qName.offsetHeight;
      const textGap  = capH * 0.06;
      const textLeft = padL + numW + W * 0.015;

      qName.style.left  = textLeft + 'px';
      qName.style.top   = (numBottom - qH) + 'px';
      weekOf.style.left = textLeft + 'px';
      weekOf.style.top  = (numBottom - qH - textGap - ofH) + 'px';

      const pipTop = numBottom + pipGap;
      pips.style.top    = pipTop + 'px';
      pips.style.left   = padL + 'px';
      pips.style.right  = (W * 0.04) + 'px';
      pips.style.height = pipH + 'px';

      const { week } = getQuarterInfo();
      pips.innerHTML = '';
      const BLUE = '#2774AE', GOLD = '#FFD100';
      for (let i = 1; i <= TOTAL_WEEKS; i++) {
        const pip = document.createElement('div');
        pip.className = 'pip';
        pip.style.height = pipH + 'px';
        const color = i % 2 === 1 ? BLUE : GOLD;
        if (i <= week) {
          pip.style.background = color;
          if (i === week) pip.style.boxShadow = `0 0 6px ${color}99`;
        }
        pips.appendChild(pip);
      }
    }

    function render() {
      const { week, name } = getQuarterInfo();
      weekNum.textContent = week || '—';
      weekOf.textContent  = week ? `of ${TOTAL_WEEKS}` : '';
      qName.textContent   = name;
      layout();
    }

    let rafId = null;
    const ro = new ResizeObserver(() => {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(layout);
    });
    ro.observe(card);

    render();
  </script>
</body>
</html>
