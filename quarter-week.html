<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quarter Week</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #191919;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .wrapper {
      width: 100%;
      padding: 8px;
      display: flex;
    }

    .card {
      container-type: inline-size;
      container-name: card;
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.5cqw 6cqw 3cqw 6cqw;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0;
      position: relative;
      overflow: hidden;
    }

    .version {
      position: absolute;
      top: 3cqw;
      left: 4cqw;
      font-size: clamp(7px, 2cqw, 10px);
      font-weight: 500;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
    }

    .label {
      position: absolute;
      top: 3cqw;
      right: 4cqw;
      font-size: clamp(9px, 3cqw, 14px);
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      text-align: right;
    }

    .week-row {
      display: flex;
      align-items: baseline;
      gap: 2cqw;
    }

    .week-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 26cqw, 110px);
      line-height: 1;
      color: #FFD100;
      letter-spacing: 0.02em;
    }

    .week-of {
      font-size: clamp(12px, 4.5cqw, 18px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.04em;
    }

    .quarter-name {
      font-size: clamp(13px, 5.5cqw, 22px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.03em;
      margin-top: -1.5cqw;
    }

    .progress-track {
      display: flex;
      gap: clamp(2px, 0.8cqw, 4px);
      width: 100%;
      margin-top: 2cqw;
    }

    .pip {
      flex: 1;
      height: clamp(4px, 1.2cqw, 7px);
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="version">v24</div>
      <div class="label">UCLA · Quarter Progress</div>
      <div class="week-row">
        <div class="week-number" id="weekNum">—</div>
        <div class="week-of" id="weekOf"></div>
      </div>
      <div class="quarter-name" id="quarterName">—</div>
      <div class="progress-track" id="pips"></div>
    </div>
  </div>

  <script>
    const card = document.querySelector('.card');
    let rafId = null;
    const ro = new ResizeObserver(() => {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        card.style.height = (card.offsetWidth * 0.36) + 'px';
      });
    });
    ro.observe(card);

    const QUARTERS = [
      { name: "Spring '26", start: 1774828800000, end: 1789948800000 },
      { name: "Fall '26",   start: 1789948800000, end: 1799020800000 },
      { name: "Winter '27", start: 1799020800000, end: 1805846400000 },
      { name: "Spring '27", start: 1805846400000, end: 1805846400000 + (10 * 7 * 86400000) },
    ];
    const TOTAL_WEEKS = 10;

    function getQuarterInfo() {
      const now = Date.now();
      for (const q of QUARTERS) {
        if (now >= q.start && now < q.end) {
          const days = Math.floor((now - q.start) / 86400000);
          const week = Math.min(TOTAL_WEEKS, Math.max(1, Math.ceil((days + 1) / 7)));
          return { week, name: q.name };
        }
      }
      for (const q of QUARTERS) {
        if (now < q.start) return { week: 0, name: `Before ${q.name}` };
      }
      return { week: 0, name: "Quarter Complete" };
    }

    function render() {
      const { week, name } = getQuarterInfo();
      document.getElementById('weekNum').textContent = week || '—';
      document.getElementById('weekOf').textContent = week ? `of ${TOTAL_WEEKS}` : '';
      document.getElementById('quarterName').textContent = name;

      const pips = document.getElementById('pips');
      pips.innerHTML = '';
      const BLUE = '#2774AE', GOLD = '#FFD100';
      for (let i = 1; i <= TOTAL_WEEKS; i++) {
        const pip = document.createElement('div');
        pip.className = 'pip';
        const color = i % 2 === 1 ? BLUE : GOLD;
        if (i <= week) {
          pip.style.background = color;
          if (i === week) pip.style.boxShadow = `0 0 6px ${color}99`;
        }
        pips.appendChild(pip);
      }
    }

    render();
  </script>
</body>
</html>
